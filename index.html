<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- RoboLore Bot Builder v1.0 -->
<title>RoboLore Bot Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: stage rail (left) + one stage at a time (right); coach chat slides in over the stage. RoboLore Heritage Blue. */
:root{
  --bg:#F5F2E9; --fg:#16243A; --muted:#4F6073; --rule:#D9D1BE; --row:#EEE8DA; --panel:#FBF9F3;
  --band:#0B1A2E; --band-fg:#F5F2E9; --brass:#C9A463; --accent:#7B6240; --slate:#3D5266;
  --ok:#2F6B45; --warn:#8C6212; --lock:#9AA3AE;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --sans:"Inter", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B1A2E; --fg:#EDE7D8; --muted:#A9B4C2; --rule:#2A3B52; --row:#112339; --panel:#0F2036;
  --band:#060F1C; --accent:#C9A463; --ok:#7CC49A; --warn:#E3B45C; --lock:#5B6878; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0B1A2E; --fg:#EDE7D8; --muted:#A9B4C2; --rule:#2A3B52; --row:#112339; --panel:#0F2036;
  --band:#060F1C; --accent:#C9A463; --ok:#7CC49A; --warn:#E3B45C; --lock:#5B6878; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--sans)}
button{font:inherit;color:inherit}
.band{background:var(--band);color:var(--band-fg);border-bottom:3px solid var(--brass);padding-block:16px;padding-inline:16px}
.band .in{max-width:1180px;margin:0 auto;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.imprint{font:500 11px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--brass)}
.band h1{font:600 26px/1.1 var(--serif);margin:6px 0 0}
.prog{font-size:13px;color:#C8CFD8;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar{width:160px;height:6px;background:#22344D;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brass);width:0}
.btn{border:1px solid var(--rule);background:var(--panel);padding:8px 12px;border-radius:3px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#FBF9F3}
.band .btn{background:transparent;color:var(--band-fg);border-color:#3D5266}
.btn:focus-visible,.stage-link:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px}
@media (max-width:820px){ .wrap{grid-template-columns:minmax(0,1fr)} .rail{order:2} }
.rail{display:grid;gap:4px;align-content:start}
.rail h2{font:600 11px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.stage-link{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;text-align:left;width:100%;padding:8px 10px;border:1px solid transparent;border-radius:3px;background:transparent;cursor:pointer}
.stage-link .num{font:500 12px var(--mono);color:var(--accent)}
.stage-link .st{font:600 10px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase}
.stage-link.cur{background:var(--panel);border-color:var(--rule)}
.stage-link.done .st{color:var(--ok)}
.stage-link.locked{color:var(--lock);cursor:not-allowed}
.stage-link.locked .num{color:var(--lock)}
.rule-card{margin-top:16px;border:1px solid var(--rule);border-left:3px solid var(--brass);padding:12px;background:var(--panel);font-size:13px}
.rule-card b{display:block;font:600 14px var(--serif);margin-bottom:4px}

main{min-width:0}
.eyebrow{font:500 12px var(--mono);color:var(--accent);letter-spacing:.1em}
main h2{font:600 clamp(24px,4vw,32px)/1.15 var(--serif);margin:4px 0 6px;text-wrap:balance}
.goal{font:500 17px/1.5 var(--serif);margin:0 0 18px;max-width:62ch}
section.blk{margin-top:24px}
h3{font:600 12px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.story{border-left:3px solid var(--brass);background:var(--panel);padding:12px 14px;max-width:66ch}
.story .lbl{font:600 11px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:4px}
.story p{margin:0}
ul.do{margin:0;padding-left:20px;display:grid;gap:6px;max-width:66ch}
.trap{margin-top:12px;font-size:14px;color:var(--warn);max-width:66ch}
.fields{display:grid;gap:14px;max-width:72ch}
label.f{display:grid;gap:6px;font-weight:500;font-size:14px}
textarea{width:100%;min-height:84px;resize:vertical;font:15px/1.5 var(--sans);padding:10px 12px;border:1px solid var(--rule);border-radius:3px;background:var(--panel);color:var(--fg)}
.saved{font-size:12px;color:var(--muted);min-height:16px}
.checks{display:grid;gap:8px;max-width:66ch}
.chk{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.chk input{margin-top:4px;width:18px;height:18px;accent-color:var(--accent);flex:none}
.coachq{font:500 16px/1.5 var(--serif);border:1px solid var(--rule);padding:12px 14px;max-width:66ch;display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.coachq span{min-width:0;flex:1 1 280px}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:28px;flex-wrap:wrap;max-width:72ch}
.lockmsg{font-size:13px;color:var(--muted)}

/* coach drawer */
.drawer{position:fixed;inset:0 0 0 auto;width:min(440px,100%);background:var(--bg);border-left:1px solid var(--rule);box-shadow:-8px 0 24px rgba(0,0,0,.18);display:flex;flex-direction:column;z-index:10;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 16px;background:var(--band);color:var(--band-fg);border-bottom:3px solid var(--brass)}
.dh b{font:600 17px var(--serif)}
.dh small{display:block;font:500 11px var(--mono);color:var(--brass);letter-spacing:.08em}
.dh .btn{background:transparent;color:var(--band-fg);border-color:#3D5266}
.msgs{flex:1;overflow-y:auto;padding:16px;display:grid;gap:12px;align-content:start}
.m{padding:10px 12px;border-radius:3px;max-width:92%;font-size:14.5px;overflow-wrap:anywhere}
.m.u{background:var(--slate);color:#F5F2E9;justify-self:end}
.m.a{background:var(--panel);border:1px solid var(--rule)}
.m.err{color:var(--warn);border:1px solid var(--warn);background:transparent}
.m code{font:13px var(--mono)}
.m p{margin:0 0 8px} .m p:last-child{margin:0}
.compose{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--rule)}
.compose textarea{min-height:44px;max-height:160px}
@media (prefers-reduced-motion:no-preference){ .drawer{transition:transform .2s ease} }
</style>
</head>
<body>

<header class="band">
  <div class="in">
    <div>
      <div class="imprint">RoboLore · Build Coach</div>
      <h1>Bot Builder</h1>
    </div>
    <div class="prog">
      <span id="progTxt">0 of 12 stages done</span>
      <span class="bar"><i id="progBar"></i></span>
      <button class="btn" id="exportBtn" type="button">Save my notebook</button>
    </div>
  </div>
</header>

<div class="wrap">
  <nav class="rail" aria-label="Build stages">
    <h2>Build stages</h2>
    <div id="rail"></div>
    <div class="rule-card">
      <b>Your notebook is always right.</b>
      Write the decision and the reason before you build. If you were absent tomorrow, a teammate should be able to build from your notes alone.
    </div>
  </nav>

  <main id="stage" tabindex="-1"></main>
</div>

<aside class="drawer" id="drawer" hidden aria-label="Coach chat">
  <div class="dh">
    <div><small id="dStage">STAGE 1</small><b>Ask the coach</b></div>
    <button class="btn" id="closeCoach" type="button">Close</button>
  </div>
  <div class="msgs" id="msgs" aria-live="polite"></div>
  <form class="compose" id="compose">
    <label for="ask" style="position:absolute;left:-9999px">Message the coach</label>
    <textarea id="ask" placeholder="Ask about this stage…" rows="2"></textarea>
    <button class="btn primary" id="sendBtn" type="submit">Send</button>
  </form>
</aside>

<script>
const COACH_URL = "https://botbuilder.weymuthd.workers.dev";
const KEY = "robolore-botbuilder-v1";

const STAGES = [
 {t:"Frame the problem", goal:"Decide what your robot must do, starting from the rules and the hardest task.",
  story:"Vortex started as a plan to convert Zircon, the soccer robot. Its low plow caught on the ramp, and it had no way to carry a ball. So Vortex started over.",
  doit:["Read the Rescue Line Robot Specs sheet.","List every field element your robot must handle: line, gaps, bumps, ramp, obstacles, evacuation zone.","Pick the one that will be hardest for your robot.","Ask: could a robot you already have physically do it?"],
  fields:["The hardest field element for my robot is… and why:","What a Zumo can and can't do on this course:","My robot must… (3 to 5 must-haves):"],
  done:["I listed every field element.","I named the hardest one and why.","I wrote my must-haves."],
  coach:"Which rule or field element would your current robot fail first, and why?"},
 {t:"Inventory before you shop", goal:"Choose a sensor for every job, starting from what the lab already has.",
  story:"The lab already owned dozens of distance sensors, so Vortex picked from the shelf first and wrote down why each one won. Several of those choices were revisited later, and the notes made that easy.",
  doit:["Count what the lab has on the shelf.","For each job (line, green markers, obstacles, heading), pick a sensor.","Write the range and what each sensor actually measures.","Check for two sensors that share the same I²C address."],
  trap:"Trap: infrared line sensors can't tell green from white. Vortex needed separate color sensors for the green markers.",
  fields:["Job → sensor → why it won (one line each):","Sensors that share an address, and my plan:"],
  done:["Every job has a sensor.","Each choice has a reason written down.","I checked for address conflicts."],
  coach:"What does this sensor need to measure, at what range, and what's your plan when two sensors share an address?"},
 {t:"Power budget", goal:"Size the battery, motor driver and regulator to the worst case, not the normal case.",
  story:"Vortex burned out three motor drivers. They were rated for the motors' running current, but a stalled motor pulls far more. Its first battery also sagged under load, which made the robot act randomly.",
  doit:["Find each motor's stall current at your battery voltage.","Pick a driver whose continuous rating is above that stall current.","Check the battery can deliver the peak current (capacity × C rating).","Check the regulator covers logic plus any servos.","Put a fuse on the battery lead."],
  trap:"Use the Ramps, Bumps and Traction worksheet to check your motors can climb the 25° ramp.",
  fields:["Motor, and stall current at my battery voltage:","Driver, and its continuous rating:","Battery (voltage, capacity, C rating) and regulator:"],
  done:["Driver rating is above stall current.","Battery can supply the peak.","I checked the ramp torque on the worksheet."],
  coach:"What's your motor's stall current at your battery voltage, and what's your driver's rating?"},
 {t:"Pin map", goal:"Give every pin exactly one job before you solder anything.",
  story:"Vortex's first code put the line sensors on the same pins as the I²C bus, and one encoder shared a pin with a line sensor. Both were caught on paper, before any solder.",
  doit:["Make a table: pin → job → part.","Reserve the I²C pins, motor PWM pins and encoder interrupt pins first.","Check every pin for a second job.","Note which parts need 5 V and which need 3.3 V."],
  fields:["My pin map (pin → job):","Pins I had to move, and why:"],
  done:["Every part has its pins.","No pin has two jobs.","Voltage for every part is noted."],
  coach:"Show me every pin that has two jobs."},
 {t:"Cheap prototype chassis", goal:"Find fit mistakes with cardboard, MDF or a quick print before the real material.",
  story:"An MDF test cut found Vortex's hole errors for pennies. 80 mm wheels didn't fit their slots; 70 mm ones did. The wheel spacing had been estimated, not measured.",
  doit:["Sketch the footprint. Keep it under 25 cm wide, with margin, for the tile openings.","Mark each dimension as measured or estimated.","Build a cheap version and set the real parts on it.","Measure the wheel-to-floor clearance and the clearance under the chassis."],
  fields:["Footprint (width × length) and clearance under the chassis:","Dimensions I estimated, which I still need to measure:","What the prototype showed was wrong:"],
  done:["I built a cheap prototype.","Every key dimension is measured, not estimated.","It fits through a 25 cm opening."],
  coach:"Which dimensions on your drawing did you measure from the real part, and which did you estimate?"},
 {t:"Bench wiring, one piece at a time", goal:"Wire power first, then add one part at a time and test each alone.",
  story:"Vortex's order: power → power distribution → I²C bus with pull-ups → controller → motor driver → motors and encoders → line sensors → distance → color. A terminal labeled “Vout” turned out to carry raw battery voltage straight to the controller, and 470 Ω resistors arrived instead of 4.7 kΩ.",
  doit:["Power off whenever you change wiring. Check polarity twice.","Measure every power rail with a meter before connecting a part.","Add one part, run its own test sketch, then add the next.","Run an I²C scan after each I²C part."],
  fields:["What I connected, and the voltage I measured on each rail:","Test result for each part:"],
  done:["Every rail measured before use.","Every part passed its own test.","A basic line follower runs on the bench."],
  coach:"Before you plug this in, what voltage should be on each terminal, and did you measure it?"},
 {t:"Random behavior? Check power first", goal:"When the robot acts randomly, measure the battery before you change code.",
  story:"Vortex spent hours fixing code for erratic motors. The real cause was the battery dropping below the motor driver's cutoff at startup.",
  doit:["Log battery voltage while the fault happens.","Make the fault happen on purpose, the same way each time.","Change one thing at a time and retest."],
  fields:["The fault, and how I make it happen:","Battery voltage at the moment it happens:","What fixed it:"],
  done:["I measured voltage during the fault.","I changed one thing at a time.","The fix is written down."],
  coach:"What does the battery voltage do at the exact moment the robot misbehaves?"},
 {t:"The real chassis", goal:"Build the final chassis from measured parts and files you can regenerate.",
  story:"Moving Vortex from laser-cut plastic to 3D printing was a full redesign. Old notes put the axle at 85 mm; the real part said 134 mm. Motors noted as 99:1 were 9.7:1.",
  doit:["Re-measure every part. Don't trust old notes.","Write down one convention: which way is front and where 0,0 is.","Keep the source files that rebuild each part, with a version number.","Leave room for wires and for reaching screws."],
  fields:["My front/back/origin convention:","Parts I re-measured, and any number that changed:","Where my source files live, and the current version:"],
  done:["Every number came from a measured part.","Orientation convention written down.","I can regenerate each part from my files."],
  coach:"Can you regenerate this exact part from your files right now?"},
 {t:"Fit-up and triage", goal:"Assemble everything and write down every problem before fixing any.",
  story:"At Vortex's first full fit-up, 11 connections were checked. Failures included a sensor's holes in the wrong pattern, a board slot 49 mm wide for a 42.6 mm board, a wheel rubbing, and a battery that didn't fit.",
  doit:["Assemble every part and board.","Make a table: part → fits / fails / not checked → note.","Measure the failures with calipers.","Pick the failure that blocks the most other parts."],
  fields:["My triage table:","The failure that blocks the most, and why:"],
  done:["Every part has a status.","Failures are measured.","I know which to fix first."],
  coach:"What's on your triage list, and which failure blocks the most other parts?"},
 {t:"Fix loop", goal:"Fix one thing per version: predict, make, measure.",
  story:"One Vortex part took about 12 versions because it kept being rebuilt from scratch. Small edits to a working version went faster.",
  doit:["Change one thing per print or cut.","Write the prediction before you print.","Measure the result and record the version.","Stop when it fits, then move to the next failure."],
  fields:["Version → the one change → result:"],
  done:["Each version changed one thing.","Every triage failure is fixed or has a plan."],
  coach:"What is the one change in this print, and how will you know it worked?"},
 {t:"Integrate and test on the field", goal:"Prove the whole robot on real field elements, then on a full course.",
  story:"This is where Vortex is now: built, but not yet run on a full course. Your robot can get here first.",
  doit:["Run the Zumo Baseline Tests (ramp, bump, tilt) on your robot and compare.","Follow a line, then add gaps, bumps and the ramp.","Run a full course under 8 minutes.","For every failure, decide: motor strength, grip, clearance, sensing, or code?"],
  fields:["Test results compared to the Zumo:","First failure on a full run, and the evidence for its cause:"],
  done:["Robot passes ramp, bump and tilt tests.","Robot completes a full line run."],
  coach:"Which test did your robot fail first, and what's your evidence for why?"},
 {t:"Share the process", goal:"Publish how you built it, not just the robot.",
  story:"Vortex's files, notes and drawings went into a repository so another team could learn from them.",
  doit:["Finish your notebook.","Add photos, the parts list and your pin map.","Write what you'd change next time."],
  fields:["What I'd change next time:","What another team needs to rebuild my robot:"],
  done:["Notebook complete.","Photos, parts list and pin map included."],
  coach:"What would another team need from your notes to rebuild your robot?"}
];

/* ---------- state ---------- */
let S = {cur:0, notes:{}, checks:{}, chats:{}};
try{ const raw = localStorage.getItem(KEY); if(raw) S = Object.assign(S, JSON.parse(raw)); }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); return true; }catch(e){ return false; } }
const isDone = i => STAGES[i].done.every((_,j)=>S.checks[i+"."+j]);
const unlocked = i => i===0 || isDone(i-1);
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function renderRail(){
  const r = $("rail"); r.innerHTML = "";
  STAGES.forEach((s,i)=>{
    const b = document.createElement("button");
    b.type="button"; b.className="stage-link"+(i===S.cur?" cur":"")+(isDone(i)?" done":"")+(!unlocked(i)?" locked":"");
    b.innerHTML = `<span class="num">${String(i+1).padStart(2,"0")}</span><span>${esc(s.t)}</span><span class="st">${isDone(i)?"Done":!unlocked(i)?"Locked":""}</span>`;
    if(unlocked(i)) b.onclick=()=>go(i); else b.setAttribute("aria-disabled","true");
    if(i===S.cur) b.setAttribute("aria-current","step");
    r.appendChild(b);
  });
  const n = STAGES.filter((_,i)=>isDone(i)).length;
  $("progTxt").textContent = `${n} of ${STAGES.length} stages done`;
  $("progBar").style.width = (n/STAGES.length*100)+"%";
}

function renderStage(){
  const i=S.cur, s=STAGES[i], m=$("stage");
  m.innerHTML = `
    <div class="eyebrow">STAGE ${String(i+1).padStart(2,"0")} OF ${STAGES.length}</div>
    <h2>${esc(s.t)}</h2>
    <p class="goal">${esc(s.goal)}</p>
    <div class="story"><span class="lbl">From the Vortex build</span><p>${esc(s.story)}</p></div>
    <section class="blk"><h3>Do this</h3><ul class="do">${s.doit.map(d=>`<li>${esc(d)}</li>`).join("")}</ul>
      ${s.trap?`<p class="trap">${esc(s.trap)}</p>`:""}</section>
    <section class="blk"><h3>Your notebook</h3><div class="fields">
      ${s.fields.map((f,j)=>`<label class="f" for="n${i}_${j}">${esc(f)}<textarea id="n${i}_${j}" data-k="${i}.${j}">${esc(S.notes[i+"."+j]||"")}</textarea></label>`).join("")}
      <div class="saved" id="savedMsg"></div></div></section>
    <section class="blk"><h3>Coach asks</h3>
      <div class="coachq"><span>${esc(s.coach)}</span><button class="btn primary" type="button" id="openCoach">Ask the coach</button></div></section>
    <section class="blk"><h3>Done when</h3><div class="checks">
      ${s.done.map((d,j)=>`<label class="chk" for="c${i}_${j}"><input type="checkbox" id="c${i}_${j}" data-k="${i}.${j}" ${S.checks[i+"."+j]?"checked":""}><span>${esc(d)}</span></label>`).join("")}
    </div></section>
    <div class="nav">
      <button class="btn" type="button" id="prevBtn" ${i===0?"disabled":""}>← Previous</button>
      <span class="lockmsg" id="lockMsg"></span>
      <button class="btn primary" type="button" id="nextBtn" ${i===STAGES.length-1?"hidden":""}>Next stage →</button>
    </div>`;
  m.querySelectorAll("textarea").forEach(t=>t.addEventListener("input",e=>{
    S.notes[e.target.dataset.k]=e.target.value;
    $("savedMsg").textContent = save() ? "Saved on this computer." : "Not saved: this browser blocks storage. Use “Save my notebook” before you leave.";
  }));
  m.querySelectorAll(".checks input").forEach(c=>c.addEventListener("change",e=>{
    S.checks[e.target.dataset.k]=e.target.checked; save(); renderRail(); updateNext();
  }));
  $("prevBtn").onclick=()=>go(i-1);
  $("nextBtn").onclick=()=>{ if(isDone(i)) go(i+1); };
  $("openCoach").onclick=openCoach;
  updateNext();
}
function updateNext(){
  const i=S.cur, ok=isDone(i), b=$("nextBtn");
  if(!b) return;
  b.disabled = !ok;
  $("lockMsg").textContent = ok || i===STAGES.length-1 ? "" : "Tick every “Done when” box to unlock the next stage.";
}
function go(i){ if(i<0||i>=STAGES.length||!unlocked(i)) return; S.cur=i; save(); renderRail(); renderStage(); $("stage").focus({preventScroll:false}); window.scrollTo(0,0); }

/* ---------- coach ---------- */
function stageContext(i){
  const s=STAGES[i];
  return [`Stage ${i+1} of ${STAGES.length}: ${s.t}`,`Goal: ${s.goal}`,`From the Vortex build: ${s.story}`,
    `Do this:\n- ${s.doit.join("\n- ")}`, s.trap?`Note: ${s.trap}`:"", `Done when:\n- ${s.done.join("\n- ")}`,
    `Coach's key question: ${s.coach}`].filter(Boolean).join("\n\n");
}
function notebookFor(i){
  return STAGES[i].fields.map((f,j)=>`${f}\n${(S.notes[i+"."+j]||"").trim()||"(blank)"}`).join("\n\n");
}
function md(t){
  let h=esc(t).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
  return h.split(/\n{2,}/).map(p=>`<p>${p.replace(/\n/g,"<br>")}</p>`).join("");
}
function renderMsgs(){
  const box=$("msgs"), list=S.chats[S.cur]||[];
  box.innerHTML = list.length?"":`<div class="m a"><p>I'm your build coach for <b>${esc(STAGES[S.cur].t)}</b>. I can see what you've written in your notebook for this stage.</p><p>${esc(STAGES[S.cur].coach)}</p></div>`;
  list.forEach(m=>{ const d=document.createElement("div"); d.className="m "+(m.role==="user"?"u":"a"); d.innerHTML=md(m.content); box.appendChild(d); });
  box.scrollTop=box.scrollHeight;
}
function openCoach(){ $("dStage").textContent=`STAGE ${S.cur+1} · ${STAGES[S.cur].t.toUpperCase()}`; renderMsgs(); $("drawer").hidden=false; $("ask").focus(); }
$("closeCoach").onclick=()=>{ $("drawer").hidden=true; };
document.addEventListener("keydown",e=>{ if(e.key==="Escape") $("drawer").hidden=true; });
$("ask").addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); $("compose").requestSubmit(); }});
let busy=false;
$("compose").addEventListener("submit",async e=>{
  e.preventDefault(); if(busy) return;
  const text=$("ask").value.trim(); if(!text) return;
  const i=S.cur; S.chats[i]=S.chats[i]||[];
  S.chats[i].push({role:"user",content:text}); $("ask").value=""; save(); renderMsgs();
  busy=true; $("sendBtn").disabled=true; $("sendBtn").textContent="…";
  try{
    const res=await fetch(COACH_URL,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({messages:S.chats[i].slice(-20),stageContent:stageContext(i),notebook:notebookFor(i)})});
    const data=await res.json();
    if(data.error) throw new Error(data.error.message||"error");
    const reply=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n").trim()||"(No answer. Try asking another way.)";
    S.chats[i].push({role:"assistant",content:reply}); save(); renderMsgs();
  }catch(err){
    S.chats[i].pop(); save(); renderMsgs();
    const d=document.createElement("div"); d.className="m err";
    d.textContent="The coach couldn't be reached. Check your internet connection and try again. If it keeps happening, tell your teacher.";
    $("msgs").appendChild(d); $("ask").value=text;
  }finally{ busy=false; $("sendBtn").disabled=false; $("sendBtn").textContent="Send"; }
});

/* ---------- export ---------- */
$("exportBtn").onclick=()=>{
  const lines=["# My Bot Builder Notebook",""];
  STAGES.forEach((s,i)=>{
    lines.push(`## Stage ${i+1}: ${s.t}${isDone(i)?" (done)":""}`,"");
    s.fields.forEach((f,j)=>{ lines.push(`**${f}**`,"",(S.notes[i+"."+j]||"").trim()||"_(blank)_",""); });
  });
  const blob=new Blob([lines.join("\n")],{type:"text/markdown"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="bot-builder-notebook.md";
  document.body.appendChild(a); a.click(); a.remove();
};

if(!unlocked(S.cur)) S.cur=0;
renderRail(); renderStage();
</script>
